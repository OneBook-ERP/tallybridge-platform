name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: onebook-erp/tallybridge-cloud

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Build frontend static files
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: cd apps/cloud-frontend && npm ci && npm run build

      # Login to GitHub Container Registry
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push backend Docker image
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Upload frontend build as artifact for deploy step
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/cloud-frontend/dist/

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      # Download frontend build
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      # Copy frontend to VM
      - name: Upload frontend to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: frontend-dist/*
          target: /opt/tallybridge/
          overwrite: true

      # Pull new image and restart
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            set -e

            # Authenticate with GitHub Container Registry
            echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the pre-built image (no building on VM)
            docker pull ghcr.io/onebook-erp/tallybridge-cloud:latest

            # Restart only the cloud container with new image
            cd /opt/tallybridge
            docker compose -f docker-compose.prod.yml up -d cloud

            # Verify health (retry up to 30s for migrations + startup)
            for i in $(seq 1 6); do
              sleep 5
              if docker exec tallybridge-cloud wget -qO- http://127.0.0.1:3000/health; then
                echo ""
                echo "Deploy successful — $(date)"
                exit 0
              fi
              echo "Health check attempt $i failed, retrying..."
            done
            echo "Health check failed after 30s"
            docker logs --tail 30 tallybridge-cloud
            exit 1
