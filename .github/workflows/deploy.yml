name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: onebook-erp/tallybridge-cloud

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Build frontend static files
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: cd apps/cloud-frontend && npm ci && npm run build

      # Login to GitHub Container Registry
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push backend Docker image
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Upload frontend build as artifact for deploy step
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/cloud-frontend/dist/

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Download frontend build
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      # Copy frontend to VM
      - name: Upload frontend to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: frontend-dist/*
          target: /opt/tallybridge/
          overwrite: true

      # Pull new image and restart
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            # Pull the pre-built image (no building on VM)
            docker pull ghcr.io/onebook-erp/tallybridge-cloud:latest

            # Restart only the cloud container with new image
            cd /opt/tallybridge
            docker compose -f docker-compose.prod.yml up -d cloud

            # Verify health
            sleep 5
            curl -sf http://localhost:3000/health || exit 1
            echo "Deploy successful — $(date)"
